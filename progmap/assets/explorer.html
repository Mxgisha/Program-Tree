<style>
/* ============================================================
   progmap explorer — self-contained dark developer UI
   ============================================================ */
:root {
  --bg: #0b1020;
  --bg-deep: #080d18;
  --panel: #111827;

  --danger: #f87171;
  --ok: #34d399;
  --kind-function: #60a5fa;
  --kind-method: #34d399;
  --kind-nested: #a78bfa;
  --kind-class: #fbbf24;
  --kind-module: #94a3b8;
  --kind-variable: #64748b;
  --kind-attribute: #64748b;
  --edge-calls: #60a5fa;
  --edge-instantiates: #fbbf24;
  --edge-references: #64748b;
  --edge-inherits: #f472b6;
  --edge-decorates: #c084fc;
  --edge-imports: #475569;
  --header-h: 58px;
  --footer-h: 26px;
  --side-w: 280px;
  --detail-w: 364px;
  --radius: 9px;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: var(--sans); font-size: 13px; line-height: 1.45;
  overflow: hidden; -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
button, [role="button"] { -webkit-tap-highlight-color: transparent; }
button:focus-visible, [role="button"]:focus-visible, input:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #253144; border-radius: 8px; border: 2px solid var(--panel); }
::-webkit-scrollbar-thumb:hover { background: #334155; }
.mono { font-family: var(--mono); }

/* ---------- app shell ---------- */
.app {
  height: 100vh; display: grid; grid-template-rows: var(--header-h) minmax(0, 1fr) var(--footer-h);
}
.topbar {
  display: flex; align-items: center; gap: 14px; padding: 0 16px;
  background: #0d1526; border-bottom: 1px solid var(--border); min-width: 0;
}
.brand { display: flex; align-items: center; gap: 9px; flex: 0 0 auto; }
.brand-mark {
  width: 30px; height: 30px; border-radius: 8px; background: #0f1b33;
  border: 1px solid #24324a; display: grid; place-items: center;
}
.brand-mark svg { display: block; }
.brand-name { font-weight: 700; letter-spacing: .2px; font-size: 14px; }
.brand-ver { font-family: var(--mono); font-size: 9.5px; color: var(--faint); margin-left: 1px; }
.root-path {
  font-family: var(--mono); font-size: 10.5px; color: var(--faint);
  background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px;
  padding: 4px 8px; max-width: 340px; white-space: nowrap; overflow: hidden;
  flex: 0 1 auto;
}
.stats { display: flex; align-items: center; gap: 5px; flex: 0 0 auto; }
.stat-chip {
  display: inline-flex; align-items: baseline; gap: 5px; height: 24px; padding: 0 8px;
  background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px;
  color: var(--faint); font-size: 10px; white-space: nowrap;
}
.stat-chip b { color: var(--text-2); font-family: var(--mono); font-weight: 600; font-size: 10.5px; }
.stat-chip.warn { color: #fca5a5; border-color: #5b2630; background: #2a151c; }
.stat-chip.warn b { color: #fecaca; }
.tabs {
  margin-left: auto; display: flex; gap: 2px; padding: 3px;
  background: var(--bg-deep); border: 1px solid var(--border); border-radius: 9px; flex: 0 0 auto;
}
.tab {
  appearance: none; border: 1px solid transparent; background: transparent;
  color: var(--dim); border-radius: 6px; height: 27px; padding: 0 13px;
  font-size: 11.5px; font-weight: 550; cursor: pointer;
}
.tab:hover { color: var(--text); background: #131d2e; }
.tab[aria-selected="true"] { color: #fff; background: #1e293b; border-color: #2b3a50; }

.shell {

/* ---------- sidebar ---------- */
.sidebar {

  background: #0e1627; border-right: 1px solid var(--border);
}
.side-search { position: relative; padding: 11px 11px 8px; flex: 0 0 auto; }

.si-main { min-width: 0; display: flex; flex-direction: column; gap: 1px; }

}
.si-sub {
  font-family: var(--mono); font-size: 9px; color: var(--faint);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 188px;
}
.si-kind { margin-left: auto; font-size: 8px; color: var(--faint); text-transform: uppercase; padding-top: 3px; }
.module-row {
  width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1px 8px;
  padding: 7px 8px; border: 1px solid transparent; border-radius: 7px;
  background: transparent; text-align: left; cursor: pointer;
}
.module-row:hover { background: #141f32; border-color: #243147; }
.module-row.is-selected { background: #17243a; border-color: #315179; }
.mod-name {
  font-family: var(--mono); font-size: 10.5px; color: var(--text-2);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.module-row.is-selected .mod-name { color: #fff; }
.mod-lines { font-family: var(--mono); font-size: 9px; color: var(--faint); text-align: right; white-space: nowrap; }
.mod-meta { font-size: 9px; color: var(--faint); }
.side-empty { padding: 18px 10px; color: var(--faint); font-size: 11px; text-align: center; line-height: 1.6; }
.side-footer {
  flex: 0 0 auto; border-top: 1px solid var(--border); padding: 8px 12px;
  color: var(--faint); font-size: 9.5px; line-height: 1.7;
}
kbd {
  display: inline-block; min-width: 16px; padding: 0 4px; height: 16px; line-height: 14px;
  border: 1px solid #2b3a50; border-bottom-color: #3b4d67; border-radius: 4px;
  background: #162033; color: var(--dim); font-family: var(--mono); font-size: 9px;

}

/* ---------- center ---------- */
.center { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg); }

}

.icon-btn, .ghost-btn {

}
.icon-btn { width: 27px; padding: 0; font-size: 14px; line-height: 1; }

}

}

.graph-wrap {

.legend-bar {

}
.legend-item { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }

/* ---------- SVG graph ---------- */
.node { cursor: pointer; }
.node-bg {
  fill: #121c2e; stroke: #26344a; stroke-width: 1; transition: fill .1s, stroke .1s, opacity .1s;
}
.node:hover .node-bg { fill: #17243a; stroke: #3b5578; }
.node.is-focus .node-bg { fill: #14243d; stroke: var(--accent); stroke-width: 1.5; }
.node.is-dim { opacity: .28; }
.node:focus { outline: none; }
.node:focus-visible .node-bg { stroke: #fff; stroke-width: 1.8; }
.node-name { fill: #e5e7eb; font-family: var(--sans); font-size: 12px; font-weight: 600; }
.node.is-focus .node-name { fill: #fff; }
.node-sub { fill: #8190a5; font-family: var(--mono); font-size: 8.5px; }
.node-kindtext { font-family: var(--sans); font-size: 7.5px; font-weight: 700; letter-spacing: .06em; }
.node-accent { opacity: .95; }
.more-chip rect { fill: #101a2b; stroke: #2a3a52; stroke-dasharray: 3 3; }
.more-chip text { fill: #7f8ea3; font-family: var(--mono); font-size: 9px; }
.edge {
  fill: none; stroke-width: 1.35; opacity: .55; transition: opacity .1s, stroke-width .1s;
}
.edge.kind-calls { stroke: var(--edge-calls); }
.edge.kind-instantiates { stroke: var(--edge-instantiates); stroke-dasharray: 4 3; }
.edge.kind-references { stroke: var(--edge-references); stroke-dasharray: 2 3; }

.edge.kind-decorates { stroke: var(--edge-decorates); }

.edge.kind-imports.type-only { stroke-dasharray: 4 3; opacity: .22; }
.edge.is-hot { opacity: 1; stroke-width: 2.6; }
.edge.kind-imports.type-only.is-hot { opacity: .6; }
.edge.is-dim { opacity: .07; }
.edge-hit { fill: none; stroke: transparent; stroke-width: 14; pointer-events: stroke; cursor: help; }

/* ---------- empty state ---------- */
.empty-state {
  flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex;
  align-items: center; justify-content: center; padding: 32px;
}

.empty-group { margin-top: 17px; }
.empty-group h3 {
  margin: 0 0 8px; color: var(--faint); font-size: 9.5px; font-weight: 650;
  text-transform: uppercase; letter-spacing: .1em;
}
.chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
.sym-chip {

}

.section { padding: 12px 16px; border-bottom: 1px solid var(--border); }

<script>
'use strict';
/* ============================================================
   Boot, data access, and global error surface
   ============================================================ */
const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const num = (v, d) => (typeof v === 'number' && isFinite(v) ? v : (d === undefined ? 0 : d));
const fmt = v => (typeof v === 'number' && isFinite(v) ? v.toLocaleString('en-US') : '—');
const esc = s => String(s === undefined || s === null ? '' : s).replace(/[&<>"']/g, c => (
  { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
));
const trunc = (s, n) => {
  const t = String(s === undefined || s === null ? '' : s);
  return t.length > n ? t.slice(0, Math.max(1, n - 1)) + '…' : t;

const labelOf = s => (s && (s.name || s.qualname || (s.id || '').split('::').pop())) || '?';

function showError(msg) {
  try {
    const el = $('#error-banner');
    if (!el) return;
    el.hidden = false;
    el.textContent = 'progmap explorer: ' + String(msg);
  } catch (_) { /* never throw from the error reporter */ }

window.onerror = function (message, source, line, col) {

/* ============================================================

const NODE_W = 190;
const NODE_H = 44;
const XGAP = 250;

function subLine(sym) {

function makeCandidates(full, side) {

  full[side].forEach((depth, id) => {

    const deg = side === 'left' ? (IN_MAP.get(id) || []).length : (OUT_MAP.get(id) || []).length;
    arr.push({ id, depth, side, weight: deg + fanIn(s) + fanOut(s) });

}
function buildLayered(focus, getAdj, allowedKinds, edgeList) {
  const full = { left: new Map(), right: new Map() };
  const run = side => {
    const seen = new Set([focus.id]);
    let frontier = [focus.id];
    for (let d = 1; d <= state.depth; d++) {
      const next = [];
      for (const id of frontier) {
        for (const step of getAdj(side, id)) {
          if (!step || !step.id || step.id === focus.id || seen.has(step.id)) continue;
          if (!allowedKinds.has(step.kind) || !BY_ID.has(step.id)) continue;
          seen.add(step.id);
          full[side].set(step.id, d);
          next.push(step.id);

      }
      frontier = next;
      if (!frontier.length) break;
    }
  };
  if (state.dir !== 'callees') run('left');
  if (state.dir !== 'callers') run('right');

  const leftAll = makeCandidates(full, 'left');
  const rightAll = makeCandidates(full, 'right');
  const leftBudget = state.dir === 'callees' ? 0 : (state.dir === 'callers' ? MAX_NEIGHBORS : 34);
  const leftKeep = leftAll.slice(0, leftBudget);
  const kept = new Set([focus.id].concat(leftKeep.map(x => x.id)));
  const rightBudget = state.dir === 'callers' ? 0
    : (state.dir === 'callees' ? MAX_NEIGHBORS : Math.max(0, Math.min(MAX_NEIGHBORS, MAX_NEIGHBORS - leftKeep.length)));
  const rightKeep = [];
  for (const c of rightAll) {
    if (kept.has(c.id)) continue;
    if (rightKeep.length >= rightBudget) break;
    rightKeep.push(c);
    kept.add(c.id);
  }

  const items = [];
  const chips = [];
  const bySide = { left: new Map(), right: new Map() };
  for (const c of leftKeep.concat(rightKeep)) {
    if (!bySide[c.side].has(c.depth)) bySide[c.side].set(c.depth, []);
    bySide[c.side].get(c.depth).push(c.id);
  }
  const posY = new Map([[focus.id, 0]]);
  items.push({ id: focus.id, x: 0, y: 0, depth: 0, side: 'focus' });

  const placeSide = side => {
    let prevIds = new Set([focus.id]);
    for (let d = 1; d <= state.depth; d++) {
      const ids = (bySide[side].get(d) || []).filter(id => kept.has(id));
      if (!ids.length) {

      const ordered = ids.map(id => {

          ? (OUT_MAP.get(id) || []).filter(e => allowedKinds.has(e.kind) && prevIds.has(e.dst))
          : (IN_MAP.get(id) || []).filter(e => allowedKinds.has(e.kind) && prevIds.has(e.src));

    minX: Math.min.apply(null, xs) - NODE_W / 2,
    maxX: Math.max.apply(null, xs) + NODE_W / 2,
    minY: Math.min.apply(null, ys) - NODE_H / 2,

    + '<td class="num">' + fmt(r.count) + '</td>'
    + '<td class="num">' + Math.round(r.confidence * 100) + '%</td>'
    + '<td class="num">' + r.lift.toFixed(2) + '</td></tr>').join('');
  const hotspotRows = HOTSPOTS.slice(0, 10).map(h =>
    '<tr data-sym="' + esc(h.id) + '"><td class="u-sym">' + esc(h.label) + '</td>'
    + '<td class="u-mod">' + esc(h.module) + '</td>'
    + '<td class="num">' + fmt(h.churn) + '</td>'
    + '<td class="num">' + fmt(h.complexity) + '</td>'
    + '<td class="num">' + fmt(h.score) + '</td></tr>').join('');
  const couplingCards = (cochangeRows
    ? '<section class="card wide"><div class="card-head"><h3>Change coupling</h3>'
      + '<span class="sub">' + fmt(num(GIT.commits)) + ' commits · how often modules change together</span></div>'
      + '<div class="card-body"><table class="mini-table"><thead><tr><th>Module A</th><th>Module B</th>'
      + '<th class="num">Together</th><th class="num">Confidence</th><th class="num">Lift</th></tr></thead>'
      + '<tbody>' + cochangeRows + '</tbody></table></div></section>' : '')
    + (hotspotRows
    ? '<section class="card wide"><div class="card-head"><h3>Hotspots</h3>'
      + '<span class="sub">file churn × function complexity</span></div>'
      + '<div class="card-body"><table class="mini-table"><thead><tr><th>Function</th><th>Module</th>'
      + '<th class="num">Churn</th><th class="num">Complexity</th><th class="num">Score</th></tr></thead>'
      + '<tbody>' + hotspotRows + '</tbody></table></div></section>' : '');

  host.innerHTML = '<div class="insights-view" style="display:flex;flex-direction:column;flex:1 1 auto;min-height:0">'
    + '<div class="view-toolbar"><div class="vt-title"><span class="kicker">Insights</span>'
    + '<span class="vt-name">hot paths, complexity, and static-analysis cycles</span></div></div>'
    + '<div class="insights-scroll"><div class="insights-grid">'
    + '<section class="card"><div class="card-head"><h3>Most-called functions</h3><span class="sub">top ' + hubs.length + '</span></div>'
    + '<div class="card-body">' + (hubRows || '<div class="insights-empty">No hub data available.</div>') + '</div></section>'
    + '<section class="card"><div class="card-head"><h3>Most complex functions</h3><span class="sub">by cyclomatic complexity</span></div>'
    + '<div class="card-body">' + (complexRows || '<div class="insights-empty">No complexity data available.</div>') + '</div></section>'
    + '<section class="card wide"><div class="card-head"><h3>Import cycles &amp; recursive groups</h3>'
    + '<span class="sub">' + MODULE_CYCLES.length + ' module · ' + FUNCTION_CYCLES.length + ' function</span></div>'
    + '<div class="card-body"><div class="cycle-block"><h4><span class="dot" style="background:#f87171"></span>Module import cycles</h4>'
    + (moduleCycleCards || '<div class="insights-empty good">No import cycles detected.</div>') + '</div>'
    + '<div class="cycle-block"><h4><span class="dot" style="background:#a78bfa"></span>Recursive groups</h4>'
    + (functionCycleCards || '<div class="insights-empty good">No recursive call groups detected.</div>') + '</div>'
    + '</div></section>'
    + couplingCards
    + '</div></div></div>';
}
function wireInsightsControls() {
  const host = $('#view');
  if (!host) return;
  host.addEventListener('click', ev => {
    const filter = ev.target.closest('[data-dead-filter]');
    if (filter) { state.deadFilter = filter.dataset.deadFilter; render(); return; }
    const sym = ev.target.closest('[data-sym]');
    if (sym) { selectSymbol(sym.dataset.sym, { tab: 'explore' }); return; }
    const mod = ev.target.closest('[data-module]');
    if (mod) { selectModule(mod.dataset.module, { tab: 'modules' }); return; }
  });
}

/* ============================================================
   Unused tab
   ============================================================ */
function renderUnused() {
  const host = $('#view');
  if (!host) return;
  const sum = DEAD.summary || {};
  const conf = sum.by_confidence || {};
  const filtered = DEAD_CANDIDATES.filter(c => state.deadFilter === 'all' || c.confidence === state.deadFilter);
  const filterBtns = ['all', 'high', 'medium', 'low'].map(v => {
    const n = v === 'all' ? DEAD_CANDIDATES.length : DEAD_CANDIDATES.filter(c => c.confidence === v).length;
    const label = v === 'all' ? 'All' : v.charAt(0).toUpperCase() + v.slice(1);
    return '<button type="button" class="filter-chip" data-dead-filter="' + v + '" aria-pressed="'
      + (state.deadFilter === v ? 'true' : 'false') + '">' + label
      + ' <span style="color:var(--faint)">' + n + '</span></button>';
  }).join('');
  const rows = filtered.map(c => {
    return '<tr data-sym="' + esc(c.id) + '" tabindex="0">'
      + '<td><span style="display:inline-flex;align-items:center;gap:6px">'
      + '<span class="dot" style="background:' + kindColor(c.kind) + '"></span>'
      + '<span class="u-sym">' + esc(c.label) + '</span></span></td>'
      + '<td><span class="kind-text">' + esc(c.kind) + '</span></td>'
      + '<td><span class="u-mod">' + esc(c.module) + '</span></td>'
      + '<td><span class="u-reason">' + esc(c.reason) + '</span></td>'
      + '<td><span class="conf ' + esc(c.confidence) + '">' + esc(c.confidence) + '</span></td></tr>';
  }).join('');
  const deadModCards = DEAD_MODULES.map(m =>
    '<button class="deadmod" data-module="' + esc(m.name) + '"><b>' + esc(m.name) + '</b>'
    + '<span>' + fmt(num(m.lines)) + ' lines · ' + fmt(num(m.symbols)) + ' symbols</span></button>').join('');
  const testRows = TEST_ONLY.map(t => '<tr data-sym="' + esc(t.id) + '" tabindex="0">'
    + '<td><span class="u-sym">' + esc(t.label) + '</span></td>'
    + '<td><span class="u-mod">' + esc(t.module) + '</span></td></tr>').join('');
  const fallback = sum.fallback
    ? '<div class="dead-banner"><strong>No entry points detected</strong>'
      + '<p>Every module was treated as a root. Pass --root or add package entry points for a precise report.</p></div>'
    : '';

  host.innerHTML = '<div class="unused-view">'
    + '<div class="view-toolbar"><div class="vt-title"><span class="kicker">Unused</span>'
    + '<span class="vt-name">reachability from ' + fmt(num(sum.roots)) + ' roots</span></div></div>'
    + '<div class="unused-scroll">'
    + '<div class="dead-summary">'
    + '<span class="stat-chip"><b>' + fmt(DEAD_CANDIDATES.length) + '</b> candidates</span>'
    + '<span class="stat-chip"><b>' + fmt(conf.high || 0) + '</b> high</span>'
    + '<span class="stat-chip"><b>' + fmt(conf.medium || 0) + '</b> medium</span>'
    + '<span class="stat-chip"><b>' + fmt(conf.low || 0) + '</b> low</span>'
    + '<span class="stat-chip"><b>' + fmt(DEAD_MODULES.length) + '</b> dead modules</span>'
    + '<span class="stat-chip"><b>' + fmt(TEST_ONLY.length) + '</b> test-only</span>'
    + '</div>'
    + '<div class="filter-row">' + filterBtns + '</div>'
    + fallback
    + '<section class="card"><div class="card-head"><h3>Unused symbols</h3>'
    + '<span class="sub">' + filtered.length + ' shown</span></div>'
    + '<div><table class="unused-table"><thead><tr><th>Symbol</th><th>Kind</th><th>Module</th><th>Reason</th><th>Confidence</th></tr></thead><tbody>'
    + (rows || '<tr><td colspan="5"><div class="insights-empty">No candidates at this confidence level.</div></td></tr>')
    + '</tbody></table></div></section>'
    + (deadModCards ? '<section class="card" style="margin-top:12px"><div class="card-head"><h3>Dead modules</h3>'
      + '<span class="sub">' + DEAD_MODULES.length + '</span></div><div class="card-body">'
      + '<div class="deadmod-grid">' + deadModCards + '</div></div></section>' : '')
    + (testRows ? '<section class="card" style="margin-top:12px"><div class="card-head"><h3>Only reached from tests</h3>'
      + '<span class="sub">' + TEST_ONLY.length + '</span></div><div class="card-body">'
      + '<table class="mini-table"><thead><tr><th>Symbol</th><th>Module</th></tr></thead><tbody>'
      + testRows + '</tbody></table></div></section>' : '')
    + '</div></div>';
}

/* ============================================================
   Symbols tab
   ============================================================ */
const SORT_COLUMNS = [
  ['name', 'Symbol', false], ['kind', 'Kind', false], ['module', 'Module', false],
  ['fan_in', 'Fan in', true], ['fan_out', 'Fan out', true],
  ['complexity', 'Complexity', true], ['loc', 'LOC', true]
];
function symbolValue(s, key) {
  if (key === 'name') return String(labelOf(s)).toLowerCase();
  if (key === 'module') return String(s.module || '').toLowerCase();
  if (key === 'kind') return String(s.kind || '').toLowerCase();
  if (key === 'fan_in') return fanIn(s);
  if (key === 'fan_out') return fanOut(s);
  if (key === 'complexity') return num(s.complexity, 1);
  if (key === 'loc') return num(s.loc, 1);
  return '';
}
function filteredSymbols() {
  const q = state.search.trim().toLowerCase();
  let list = SYMBOLS;
  if (q) {
    list = SYMBOLS.filter(s => {
      const name = String(s.name || '').toLowerCase();
      const qn = String(s.qualname || '').toLowerCase();
      const mod = String(s.module || '').toLowerCase();
      return name.includes(q) || qn.includes(q) || mod.includes(q) || String(s.id || '').toLowerCase().includes(q);
    });
  }
  const key = state.sortKey, dir = state.sortDir;
  return list.slice().sort((a, b) => {
    const av = symbolValue(a, key), bv = symbolValue(b, key);
    let cmp;
    if (typeof av === 'number' && typeof bv === 'number') cmp = av - bv;
    else cmp = String(av).localeCompare(String(bv));
    if (!cmp) cmp = String(labelOf(a)).localeCompare(String(labelOf(b))) || String(a.id).localeCompare(String(b.id));
    return cmp * dir;
  });
}
function symbolsTableRows() {
  const all = filteredSymbols();
  const shown = all.slice(0, 500);
  const q = state.search.trim();
  const rows = shown.map(s => {
    const name = labelOf(s);
    const qn = s.qualname && s.qualname !== name ? s.qualname : '';
    return '<tr data-row-sym="' + esc(s.id) + '" tabindex="0" role="button" aria-label="' + esc(name + ' ' + (s.module || '')) + '">'
      + '<td><div class="sym-cell"><span class="dot" style="background:' + kindColor(s.kind) + '"></span>'
      + '<span style="min-width:0"><span class="sym-name">' + esc(name) + '</span>'
      + (qn ? '<span class="sym-qual">' + esc(qn) + '</span>' : '') + '</span></div></td>'
      + '<td><span class="kind-text">' + esc(s.kind || '') + '</span></td>'
      + '<td><span class="module-cell" title="' + esc(s.module || '') + '">' + esc(s.module || '') + '</span></td>'
      + '<td class="num">' + fmt(fanIn(s)) + '</td>'
      + '<td class="num">' + fmt(fanOut(s)) + '</td>'
      + '<td class="num">' + fmt(num(s.complexity, 1)) + '</td>'
      + '<td class="num">' + fmt(num(s.loc, 1)) + '</td></tr>';
  }).join('');
  return { all, shown, rows, q };
}
function renderSymbolsBody() {
  const data = symbolsTableRows();
  const tbody = $('#symbols-body');
  if (tbody) {
    tbody.innerHTML = data.rows || '';
    if (!data.rows) {
      tbody.innerHTML = '<tr><td colspan="7"><div class="insights-empty">No symbols match'
        + (data.q ? ' "' + esc(data.q) + '"' : '') + '.</div></td></tr>';
    }
  }
  const count = $('#symbols-count');
  if (count) {
    count.textContent = data.all.length + ' symbol' + (data.all.length === 1 ? '' : 's')
      + (data.all.length > 500 ? ' · showing 500' : '');
  }
  const note = $('#table-note');
  if (note) {
    note.textContent = data.all.length > 500
      ? 'Showing the first 500 of ' + fmt(data.all.length) + ' matching symbols. Narrow the filter to see more.'
      : 'Showing ' + data.rows + ' matching symbol' + (data.all.length === 1 ? '' : 's') + '.';
  }
}
function renderSymbols() {
  const host = $('#view');
  if (!host) return;
  const header = SORT_COLUMNS.map(([key, label, isNum]) => {
    const arrow = state.sortKey === key ? '<span class="arrow">' + (state.sortDir > 0 ? '↑' : '↓') + '</span>' : '';
    return '<th class="' + (isNum ? 'num' : '') + '" aria-sort="' + (state.sortKey === key ? (state.sortDir > 0 ? 'ascending' : 'descending') : 'none') + '">'
      + '<button type="button" class="sort-btn" data-sort="' + key + '">' + esc(label) + arrow + '</button></th>';
  }).join('');
  host.innerHTML = '<div class="symbols-view">'
    + '<div class="symbols-bar"><span class="kicker">All symbols</span>'
    + '<input id="symbols-filter" type="text" placeholder="Filter symbols…" autocomplete="off" spellcheck="false" aria-label="Filter symbols" value="' + esc(state.search) + '">'
    + '<span class="symbols-count" id="symbols-count"></span></div>'
    + '<div class="table-scroll"><table class="symbols"><thead><tr>' + header + '</tr></thead>'
    + '<tbody id="symbols-body"></tbody></table></div>'
    + '<div class="table-note" id="table-note"></div></div>';
  renderSymbolsBody();
  const filter = $('#symbols-filter');
  if (filter) {
    filter.addEventListener('input', () => {
      state.search = filter.value;
      renderSymbolsBody();
    });
    filter.addEventListener('keydown', ev => {
      if (ev.key === 'Enter') {
        const first = $('#symbols-body tr[data-row-sym]');
        if (first) selectSymbol(first.dataset.rowSym, { tab: 'explore' });
      }
    });
  }
}
function wireSymbolsControls() {
  const host = $('#view');
  if (!host) return;
  host.addEventListener('click', ev => {
    const sort = ev.target.closest('[data-sort]');
    if (sort) {
      const key = sort.dataset.sort;
      if (state.sortKey === key) state.sortDir *= -1;
      else { state.sortKey = key; state.sortDir = (key === 'name' || key === 'kind' || key === 'module') ? 1 : -1; }
      renderSymbols();
      return;
    }
    const row = ev.target.closest('[data-row-sym]');
    if (row) { selectSymbol(row.dataset.rowSym, { tab: 'explore' }); return; }
  });
  host.addEventListener('keydown', ev => {
    if (ev.key !== 'Enter' && ev.key !== ' ') return;
    const row = ev.target.closest('[data-row-sym]');
    if (!row) return;
    ev.preventDefault();
    selectSymbol(row.dataset.rowSym, { tab: 'explore' });
  });
}

/* ============================================================
   Global event wiring, render dispatcher, boot
   ============================================================ */
function render() {
  renderTabs();
  renderHeader();
  renderSidebar();
  if (state.tab === 'explore') renderExplore();
  else if (state.tab === 'modules') renderModules();
  else if (state.tab === 'insights') renderInsights();
  else if (state.tab === 'unused') renderUnused();
  else renderSymbols();
  renderDetails();
}
function wireDetails() {
  const host = $('#details');
  if (!host) return;
  host.addEventListener('click', ev => {
    const copy = ev.target.closest('[data-copy]');
    if (copy) { copyText(copy.dataset.copy || '', copy); return; }
    const docToggle = ev.target.closest('[data-doc-toggle]');
    if (docToggle) {
      const doc = host.querySelector('[data-doc]');
      if (doc) {
        const clamped = doc.classList.toggle('clamped');
        docToggle.textContent = clamped ? 'More' : 'Less';
      }
      return;
    }
    const expand = ev.target.closest('[data-expand]');
    if (expand) {
      const key = expand.dataset.expand;
      if (state.detailExpand.has(key)) state.detailExpand.delete(key); else state.detailExpand.add(key);
      renderDetails();
      return;
    }
    const open = ev.target.closest('[data-open-explore]');
    if (open && state.selected) { selectSymbol(state.selected, { tab: 'explore' }); return; }
    const sym = ev.target.closest('[data-sym]');
    if (sym) { selectSymbol(sym.dataset.sym, { tab: 'explore' }); return; }
    const mod = ev.target.closest('[data-module]');
    if (mod) { selectModule(mod.dataset.module, { tab: 'modules' }); return; }
    const row = ev.target.closest('[data-row-sym]');
    if (row) { selectSymbol(row.dataset.rowSym, { tab: 'explore' }); return; }
  });
}
function wireSidebar() {
  const host = $('#side-list');
  if (host) {
    host.addEventListener('click', ev => {
      const sym = ev.target.closest('[data-sym]');
      if (sym) { selectSymbol(sym.dataset.sym, { tab: 'explore' }); return; }
      const mod = ev.target.closest('[data-module-row]');
      if (mod) {
        /* Keep the current tool context; a module in Explore shows its imports. */
        selectSymbol(mod.dataset.module, { tab: state.tab === 'symbols' ? 'modules' : state.tab });
      }
    });
  }
  const input = $('#search');
  if (input) {
    input.addEventListener('input', () => {
      state.search = input.value;
      renderSidebar();
      if (state.tab === 'symbols') renderSymbolsBody();
    });
    input.addEventListener('keydown', ev => {
      if (ev.key === 'Enter') {
        const first = $('#side-list [data-sym]');
        if (first) selectSymbol(first.dataset.sym, { tab: 'explore' });
      } else if (ev.key === 'ArrowDown') {
        const first = $('#side-list [data-sym]');
        if (first) { ev.preventDefault(); first.focus(); }
      }
    });
  }
  const clear = $('#search-clear');
  if (clear) {
    clear.addEventListener('click', () => {
      state.search = '';
      if (input) input.value = '';
      renderSidebar();
      if (input) input.focus();
    });
  }
}
function wireGlobalKeys() {
  document.addEventListener('keydown', ev => {
    const t = ev.target;
    const typing = !!(t && t.matches && t.matches('input, textarea, select, [contenteditable="true"]'));
    if (ev.key === '/' && !typing) {
      ev.preventDefault();
      focusSearch();
      return;
    }
    if (ev.key === 'Escape') {
      let changed = false;
      if (state.search) {
        state.search = '';
        const si = $('#search'); if (si) si.value = '';
        const sf = $('#symbols-filter'); if (sf) sf.value = '';
        changed = true;
      }
      if (state.selected) { state.selected = null; state.detailExpand.clear(); changed = true; }
      if (changed) { syncHash(); render(); }
      if (t && t.blur) t.blur();
      return;
    }
    if (!typing && state.tab === 'explore' && (ev.key === '1' || ev.key === '2' || ev.key === '3')) {
      const next = parseInt(ev.key, 10);
      if (next !== state.depth) {
        state.depth = next;
        state.fitPending = true;
        renderExplore();
      }
    }
  });
}
function boot() {
  wireSidebar();
  wireDetails();
  wireGlobalKeys();
  wireExploreControls();
  wireModulesControls();
  wireInsightsControls();
  wireSymbolsControls();
  $$('.tab').forEach(btn => btn.addEventListener('click', () => setTab(btn.dataset.tab)));

  const initial = parseRoute();
  applyRoute(initial);
  if (!location.hash) history.replaceState(null, '', hashFor());
  render();

  window.addEventListener('hashchange', () => {
    const route = parseRoute();
    if (route.tab === state.tab && route.selected === state.selected) return;
    applyRoute(route);
    render();
  });
  let resizeTimer = null;
  window.addEventListener('resize', () => {
    renderHeader();
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      /* Explore centres itself through its viewBox; only the circular
         module layout needs a redraw at the new pixel size. */
      if (state.tab === 'modules') drawModules();
    }, 160);
  });
}
boot();
</script>
</body>
