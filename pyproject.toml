[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "progmap"
version = "0.2.0"
description = "A static, LLM-free map of a Python codebase: symbols, calls, imports, hierarchies and cycles."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["static-analysis", "call-graph", "ast", "code-visualization"]
dependencies = []
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
progmap = "progmap.cli:main"

[tool.setuptools.packages.find]
include = ["progmap*"]

[tool.setuptools.package-data]
progmap = ["assets/*.html"]
